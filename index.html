<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>나의 온라인 메모장</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 700px;
      margin: 0 auto;
      padding: 30px 20px;
      background: #f5f5f5;
    }

    h1 {
      text-align: center;
    }

    input, textarea {
      width: 100%;
      box-sizing: border-box;
      padding: 12px;
      margin-top: 8px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
    }

    textarea {
      height: 150px;
      resize: vertical;
    }

    button {
      padding: 10px 16px;
      margin: 8px 4px 0 0;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 15px;
    }

    .primary {
      background: #333;
      color: white;
    }

    .danger {
      background: #ddd;
    }

    .hidden {
      display: none;
    }

    .memo {
      background: white;
      margin-top: 20px;
      padding: 15px;
      border-radius: 10px;
      white-space: pre-wrap;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    #status {
      margin-top: 15px;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <h1>📝 나의 온라인 메모장</h1>

  <!-- 로그인 영역 -->
  <div id="authArea">
    <h3>로그인</h3>

    <input id="email" type="email" placeholder="이메일">
    <input id="password" type="password" placeholder="비밀번호">

    <button class="primary" onclick="signUp()">회원가입</button>
    <button onclick="signIn()">로그인</button>

    <p id="authMessage"></p>
  </div>

  <!-- 메모 영역 -->
  <div id="memoArea" class="hidden">

    <p>
      로그인 계정:
      <strong id="userEmail"></strong>
    </p>

    <textarea
      id="memoInput"
      placeholder="여기에 메모를 입력하세요..."
    ></textarea>

    <button class="primary" onclick="saveMemo()">💾 저장</button>
    <button class="danger" onclick="deleteMemo()">🗑️ 삭제</button>
    <button onclick="signOut()">로그아웃</button>

    <p id="status"></p>

    <div id="memoDisplay" class="memo hidden"></div>

  </div>

  <script type="module">

    /*
      Supabase 연결

      아래 두 값은 나중에 Vercel 환경변수와 연결합니다.
    */

    const SUPABASE_URL = "YOUR_SUPABASE_URL";
    const SUPABASE_KEY = "YOUR_SUPABASE_PUBLISHABLE_KEY";

    import {
      createClient
    } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

    const supabase = createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );

    const authArea = document.getElementById("authArea");
    const memoArea = document.getElementById("memoArea");
    const userEmail = document.getElementById("userEmail");

    const emailInput = document.getElementById("email");
    const passwordInput = document.getElementById("password");

    const memoInput = document.getElementById("memoInput");
    const memoDisplay = document.getElementById("memoDisplay");

    const authMessage = document.getElementById("authMessage");
    const status = document.getElementById("status");

    let currentUser = null;

    async function updateUI() {

      const {
        data: {
          user
        }
      } = await supabase.auth.getUser();

      currentUser = user;

      if (user) {

        authArea.classList.add("hidden");
        memoArea.classList.remove("hidden");

        userEmail.textContent = user.email;

        loadMemo();

      } else {

        authArea.classList.remove("hidden");
        memoArea.classList.add("hidden");

      }
    }

    window.signUp = async function() {

      const email = emailInput.value.trim();
      const password = passwordInput.value;

      if (!email || !password) {
        authMessage.textContent =
          "이메일과 비밀번호를 입력해주세요.";
        return;
      }

      const {
        error
      } = await supabase.auth.signUp({
        email,
        password
      });

      if (error) {

        authMessage.textContent =
          "회원가입 오류: " + error.message;

        return;
      }

      authMessage.textContent =
        "회원가입이 완료되었습니다. 이메일 확인이 필요한 경우 이메일을 확인해주세요.";

    };

    window.signIn = async function() {

      const email = emailInput.value.trim();
      const password = passwordInput.value;

      const {
        error
      } = await supabase.auth.signInWithPassword({
        email,
        password
      });

      if (error) {

        authMessage.textContent =
          "로그인 오류: " + error.message;

        return;
      }

      authMessage.textContent =
        "로그인되었습니다.";

      updateUI();

    };

    window.signOut = async function() {

      await supabase.auth.signOut();

      memoInput.value = "";
      memoDisplay.textContent = "";

      updateUI();

    };

    window.saveMemo = async function() {

      if (!currentUser) {
        return;
      }

      const content = memoInput.value.trim();

      if (!content) {

        status.textContent =
          "메모를 입력해주세요.";

        return;
      }

      const {
        error
      } = await supabase
        .from("notes")
        .insert({
          content: content,
          user_id: currentUser.id
        });

      if (error) {

        status.textContent =
          "저장 오류: " + error.message;

        return;
      }

      status.textContent =
        "메모가 온라인에 저장되었습니다. ☁️";

      memoInput.value = "";

      loadMemo();

    };

    async function loadMemo() {

      if (!currentUser) {
        return;
      }

      const {
        data,
        error
      } = await supabase
        .from("notes")
        .select("*")
        .eq("user_id", currentUser.id)
        .order("created_at", {
          ascending: false
        });

      if (error) {

        status.textContent =
          "불러오기 오류: " + error.message;

        return;
      }

      memoDisplay.innerHTML = "";

      if (!data || data.length === 0) {

        memoDisplay.classList.add("hidden");

        return;
      }

      memoDisplay.classList.remove("hidden");

      data.forEach(note => {

        const div = document.createElement("div");

        div.className = "memo";

        div.textContent =
          note.content;

        memoDisplay.appendChild(div);

      });

    }

    window.deleteMemo = async function() {

      if (!currentUser) {
        return;
      }

      const {
        error
      } = await supabase
        .from("notes")
        .delete()
        .eq("user_id", currentUser.id);

      if (error) {

        status.textContent =
          "삭제 오류: " + error.message;

        return;
      }

      memoInput.value = "";
      memoDisplay.innerHTML = "";
      memoDisplay.classList.add("hidden");

      status.textContent =
        "내 메모가 삭제되었습니다.";

    };

    supabase.auth.onAuthStateChange(
      () => {
        updateUI();
      }
    );

    updateUI();

  </script>

</body>
</html>

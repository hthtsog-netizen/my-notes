<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>나의 메모장</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 700px;
      margin: 0 auto;
      padding: 30px 20px;
      background: #f5f5f5;
    }

    h1 {
      text-align: center;
    }

    textarea {
      width: 100%;
      height: 180px;
      padding: 15px;
      box-sizing: border-box;
      font-size: 16px;
      border: 1px solid #ccc;
      border-radius: 10px;
      resize: vertical;
    }

    button {
      margin-top: 10px;
      padding: 10px 18px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 15px;
    }

    .save {
      background: #333;
      color: white;
    }

    .delete {
      background: #ddd;
    }

    .memo {
      background: white;
      margin-top: 20px;
      padding: 15px;
      border-radius: 10px;
      white-space: pre-wrap;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }
  </style>
</head>

<body>

  <h1>📝 나의 메모장</h1>

  <textarea id="memoInput" placeholder="여기에 메모를 입력하세요..."></textarea>

  <br>

  <button class="save" onclick="saveMemo()">💾 저장</button>
  <button class="delete" onclick="deleteMemo()">🗑️ 삭제</button>

  <div id="memoDisplay" class="memo" style="display:none;"></div>

  <script>
    const input = document.getElementById("memoInput");
    const display = document.getElementById("memoDisplay");

    function loadMemo() {
      const savedMemo = localStorage.getItem("myMemo");

      if (savedMemo) {
        input.value = savedMemo;
        display.textContent = savedMemo;
        display.style.display = "block";
      }
    }

    function saveMemo() {
      const memo = input.value.trim();

      if (memo === "") {
        alert("메모를 입력해주세요.");
        return;
      }

      localStorage.setItem("myMemo", memo);
      display.textContent = memo;
      display.style.display = "block";

      alert("메모가 저장되었습니다!");
    }

    function deleteMemo() {
      localStorage.removeItem("myMemo");
      input.value = "";
      display.textContent = "";
      display.style.display = "none";
    }

    loadMemo();
  </script>

</body>
</html>
